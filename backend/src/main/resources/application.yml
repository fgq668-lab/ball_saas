server:
  port: ${PORT:18200}

spring:
  application:
    name: ball-saas-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ball_saas}
    username: ${DB_USERNAME:ball_saas}
    password: ${DB_PASSWORD:ball_saas_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info

ballsaas:
  redis-prefix: ballsaas
  booking-lock-minutes: 10
  slot-minutes: 30

